<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>SWU · Local observation fixture</title
  ><style>
    body {
      font: 18px/1.6 system-ui;
      background: #ecf3f0;
      color: #16352c;
      max-width: 760px;
      margin: 80px auto;
      padding: 24px;
    }
    h1 {
      font-size: 42px;
      line-height: 1.15;
    }
    input {
      display: block;
      font: inherit;
      padding: 12px;
      border: 2px solid #537d6c;
      border-radius: 8px;
      width: 100%;
      margin: 12px 0;
    }
    a {
      color: #166655;
    }
    .card {
      padding: 28px;
      background: white;
      border-radius: 16px;
      border: 1px solid #c3d7cf;
    }
  </style>
  <body>
    <p>PAW / SYNTHETIC LOCAL FIXTURE</p>
    <h1>Read the viewport.<br />Check before acting.</h1>
    <div class="card">
      <label for="query">Demo query</label
      ><input
        id="query"
        type="search"
        placeholder="A reusable named string parameter"
      />
      <p id="echo">No query entered.</p>
      <a href="/reading">Open a local reading page</a>
    </div>
    <p>
      This fixture is not real-site or extension installation evidence. No data
      is submitted.
    </p>
    <script>
      document
        .querySelector("#query")
        .addEventListener(
          "input",
          (e) =>
            (document.querySelector("#echo").textContent =
              "Current demo query: " + e.target.value),
        );
    </script>
  </body>
</html>
